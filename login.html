<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MENU DE NAVEGAÇÃO -->
    <header>

        <div class="logo">
            <div class="logo-icon">🌸</div>

            <h1>
                <span>Sakura</span> Sushi
            </h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Menu</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="reservas.html">Reservas</a></li>
                <li><a href="cardapio.html">Cardápio</a></li>
                <li><a href="carrinho.html">Carrinho</a></li>
                <li><a href="promocoes.html">Promoções</a></li>
                <li><a href="login.html">Entrar</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>

    </header>


    <!-- PÁGINA DE LOGIN -->
    <main class="pagina-login">

        <!-- LOGO -->
        <div class="brand">

            <span class="logo-icon">🌸</span>

            <span class="brand-text">
                Sakura <span class="sushi">Sushi</span>
            </span>

        </div>


        <!-- BEM-VINDO -->
        <p class="welcome">
            Bem Vindo de Volta!
        </p>


        <!-- CAIXA DE LOGIN -->
        <form class="login-card" onsubmit="return false;">

            <h2>Entrar</h2>


            <!-- EMAIL -->
            <div class="field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email"
                    required
                >

            </div>


            <!-- SENHA -->
            <div class="field">

                <label for="senha">
                    Senha
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Senha"
                        required
                    >

                   <button
    type="button"
    class="eye-button"
    onclick="togglePassword('senha', this)"
>
    <svg viewBox="0 0 24 24">
        <path
            d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
        ></path>

        <circle
            cx="12"
            cy="12"
            r="2.5"
        ></circle>

        <line
            x1="4"
            y1="4"
            x2="20"
            y2="20"
        ></line>
    </svg>
</button>
                </div>


                <!-- ESQUECI A SENHA -->
                <div class="forgot">

                    <a href="esqueci.html">
                        Esqueci Minha Senha
                    </a>

                </div>

            </div>


            <!-- BOTÃO ENTRAR -->
            <button
                type="submit"
                class="btn-entrar"
            >
                Entrar
            </button>


            <!-- CADASTRO -->
            <div class="signup">

                <p>
                    Ainda não tem conta?
                </p>

                <a href="cadastro.html">
                    Cadastre-se!
                </a>

            </div>

        </form>

    </main>


    <!-- MOSTRAR / ESCONDER SENHA -->
    <script>

        function togglePassword() {

            const input = document.getElementById("senha");

            if (input.type === "password") {

                input.type = "text";

            } else {

                input.type = "password";

            }

        }

    </script>

</body>
</html>
