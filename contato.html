<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- MENU DE NAVEGAÇÃO -->
    <header>

        <div class="logo">

            <div class="logo-icon">🌸</div>

            <h1>
                <span>Sakura</span> Sushi
            </h1>

        </div>


        <nav>

            <ul>

                <li><a href="index.html">Menu</a></li>

                <li><a href="sobre.html">Sobre</a></li>

                <li><a href="reservas.html">Reservas</a></li>

                <li><a href="cardapio.html">Cardápio</a></li>

                <li><a href="carrinho.html">Carrinho</a></li>

                <li><a href="promocoes.html">Promoções</a></li>

                <li><a href="login.html">Login</a></li>

                <li><a href="contato.html">Contato</a></li>

            </ul>

        </nav>

    </header>


    <!-- PÁGINA DE CONTATO -->
    <main class="contato">

        <h2>
            Fale Conosco
        </h2>

<form class="form-contato" action="mensagem-enviada.html"></form>

            <!-- CAMPOS EM DUAS COLUNAS -->
            <div class="campos-duplos">


                <!-- NOME -->
                <div class="campo-contato">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu Nome"
                    >

                </div>


                <!-- EMAIL -->
                <div class="campo-contato">

                    <label for="email-contato">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email-contato"
                        name="email"
                        placeholder="Exemplo@exemplo.com.br"
                    >

                </div>


                <!-- TELEFONE -->
                <div class="campo-contato">

                    <label for="telefone">
                        Telefone Fixo
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(99) 9999-9999"
                    >

                </div>


                <!-- CELULAR -->
                <div class="campo-contato">

                    <label for="celular">
                        Celular
                    </label>

                    <input
                        type="tel"
                        id="celular"
                        name="celular"
                        placeholder="(99) 99999-9999"
                    >

                </div>


                <!-- CIDADE -->
                <div class="campo-contato">

                    <label for="cidade">
                        Cidade/UF
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Digite sua Cidade"
                    >

                </div>


                <!-- NÚMERO DO PEDIDO -->
                <div class="campo-contato">

                    <label for="pedido">
                        N° Pedido
                    </label>

                    <input
                        type="text"
                        id="pedido"
                        name="pedido"
                        placeholder="Número do Seu Pedido"
                    >

                </div>

            </div>


            <!-- ASSUNTO -->
            <div class="campo-contato campo-largo">

                <label for="assunto">
                    Selecione um Assunto
                </label>

                <select
                    id="assunto"
                    name="assunto"
                >

                    <option value="">
                        Escolha um assunto
                    </option>

                    <option value="pedido">
                        Problema com pedido
                    </option>

                    <option value="duvida">
                        Dúvida
                    </option>

                    <option value="elogio">
                        Elogio
                    </option>

                    <option value="reclamacao">
                        Reclamação
                    </option>

                    <option value="outro">
                        Outro
                    </option>

                </select>

            </div>


            <!-- CATEGORIA -->
            <div class="categoria-contato">

                Categoria:

            </div>


            <!-- MENSAGEM -->
            <div class="campo-contato campo-mensagem">

                <label for="mensagem">
                    Mensagem
                </label>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    placeholder="Digite sua mensagem"
                ></textarea>

            </div>


            <!-- BOTÃO -->
            <div class="area-botao">

                <button type="submit">
                    enviar
                </button>

            </div>

        </form>

    </main>

</body>
</html>
